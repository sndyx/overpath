[package]
name = "overpath"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["glow"]
web_app = ["http"]
http = ["ehttp"]
glow = ["eframe/glow"]

[dependencies]
eframe = { version = "0.23.0", default-features = false }
egui = { version = "0.23.0", features = [
    "callstack",
    "extra_debug_asserts",
    "log",
] }
egui_extras = "0.23.0"
log = { version = "0.4", features = ["std"] }
serde_json = "1.0"


# feature "http":
ehttp = { version = "0.3.1", optional = true }
serde = { version = "1.0.188", features = ["derive"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.10"
rfd = { version = "0.11", optional = true }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.87"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
