<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <title>Overpath - Pathfinder</title>
    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #404040;
            }
        }

        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0%;
            left: 50%;
            transform: translate(-50%, 0%);
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        .lds-ring {
            display: inline-block;
            position: relative;
            width: 40px;
            height: 40px;
        }
        .lds-ring div {
            box-sizing: border-box;
            display: block;
            position: absolute;
            width: 32px;
            height: 32px;
            margin: 4px;
            border: 4px solid #fff;
            border-radius: 50%;
            animation: lds-ring 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
            border-color: #fff transparent transparent transparent;
        }
        .lds-ring div:nth-child(1) {
            animation-delay: -0.45s;
        }
        .lds-ring div:nth-child(2) {
            animation-delay: -0.3s;
        }
        .lds-ring div:nth-child(3) {
            animation-delay: -0.15s;
        }
        @keyframes lds-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
<canvas id="the_canvas_id"></canvas>
<div class="centered" id="center_text">
    <p style="font-size:16px">
        &nbsp;&nbsp;&nbsp;Loading…
    </p>
    <div class="lds-ring"><div></div><div></div><div></div><div></div></div>
</div>

<script>
    delete WebAssembly.instantiateStreaming;
</script>

<script src="overpath.js"></script>

<script>
    console.debug("Loading wasm…");
    wasm_bindgen("./overpath_bg.wasm")
        .then(on_wasm_loaded)
        .catch(on_error);

    function on_wasm_loaded() {
        console.debug("Wasm loaded. Starting app…");

        let handle = new wasm_bindgen.WebHandle();

        function check_for_panic() {
            if (handle.has_panicked()) {
                console.error("The egui app has crashed");

                document.getElementById("the_canvas_id").remove();
                document.getElementById("center_text").innerHTML = `
                        <p>
                            The egui app has crashed.
                        </p>
                        <p style="font-size:10px" align="left">
                            ${handle.panic_message()}
                        </p>
                        <p style="font-size:14px">
                            See the console for details.
                        </p>
                        <p style="font-size:14px">
                            Reload the page to try again.
                        </p>`;
            } else {
                let delay_ms = 1000;
                setTimeout(check_for_panic, delay_ms);
            }
        }

        check_for_panic();

        handle.start("the_canvas_id").then(on_app_started).catch(on_error);
    }

    function on_app_started(handle) {
        // Call `handle.destroy()` to stop. Uncomment to quick result:
        // setTimeout(() => { handle.destroy(); handle.free()) }, 2000)

        console.debug("App started.");
        document.getElementById("center_text").innerHTML = '';
    }

    function on_error(error) {
        console.error("Failed to start: " + error);
        document.getElementById("the_canvas_id").remove();
        document.getElementById("center_text").innerHTML = `
                <p>
                    An error occurred during loading:
                </p>
                <p style="font-family:Courier New">
                    ${error}
                </p>
                <p style="font-size:14px">
                    Make sure you use a modern browser with WebGL and WASM enabled.
                </p>`;
    }
</script>
</body>

</html>
